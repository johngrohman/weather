name: api CI

on:
  push:
    paths:
      - api/**
  pull_request:
    branches: [dev]
    paths:
      - api/**

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Linter
        run: bash scripts/run_linter.sh

      - name: Type Checking
        run: bash scripts/run_type_checking.sh

  docker:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .